plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run options names with fabric
        }
        client {
            client()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    //modCompileOnly "maven.modrinth:forgified-fabric-api:${fabric_version}"

    implementation "net.caffeinemc:sodium-neoforge:${sodium_version}"
    implementation "net.caffeinemc:sodium-neoforge-mod:${sodium_version}"
    implementation "net.caffeinemc:sodium-neoforge-api:${sodium_version}"
}