plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${archives_base_name}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    // withJavadocJar()
}

repositories {
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Fabric"
                url = "https://maven.fabricmc.net"
            }
        }
        filter {
            includeGroupAndSubgroups("net.fabricmc")
        }
    }

    exclusiveContent {
        forRepositories(
            maven {
                name = "caffeinemcRepositoryReleases"
                url = "https://maven.caffeinemc.net/releases"
            },
            maven {
                name = "caffeinemcRepositorySnapshots"
                url = "https://maven.caffeinemc.net/snapshots"
            }
        )
        filter {
            includeGroup("net.caffeinemc")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "sinytraMavenReleases"
                url = "https://maven.su5ed.dev/releases"
            }
        }
        filter {
            includeGroup("org.sinytra.forgified-fabric-api")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "ParchmentMC"
                url = "https://maven.parchmentmc.org"
            }
        }
        filter {
            includeGroup("org.parchmentmc.data")
        }
    }
    mavenCentral()
}

dependencies {
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // implementation "maven.modrinth:sodium:${sodium_version}-neoforge"
    // implementation files("${rootProject.rootDir}/custom_sodium/sodium-neoforge-${sodium_version}.jar")
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->    //, 'javadocElements'
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'archives_base_name'           : archives_base_name,
			'sodium_version'               : sodium_version,
            'issue_tracker_url'            : issue_tracker_url,
            'modrinth_url'                 : modrinth_url
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url = System.getenv('local_maven_url')
        }
    }
}
